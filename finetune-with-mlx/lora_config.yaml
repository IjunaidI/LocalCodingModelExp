# LoRA config for v5 — tuned to close the train/val loss gap.
# Changes vs v3: richer stratified data (held-out phrasings per fact), dropout on,
# fewer iters. Goal is val loss that tracks train loss, not raw memorization.
model: "mlx-community/SmolLM2-135M-Instruct"
train: true
data: "data"
adapter_path: "adapters_v5"

fine_tune_type: lora
num_layers: -1          # fine-tune all transformer layers
batch_size: 4
iters: 300              # down from 600 — ~12 epochs overfit a tiny set; ~6 is plenty
learning_rate: 1e-5
max_seq_length: 512

steps_per_report: 25
steps_per_eval: 50      # denser val sampling so the curve is easier to read
save_every: 100
val_batches: -1         # use full validation set
seed: 0

lora_parameters:
  rank: 16              # capacity for facts
  scale: 20.0
  dropout: 0.2          # tightest-tracking setting — caps how low train loss can collapse,
                        # so val hugs train. Trades some fact-recall sharpness for a small gap.
